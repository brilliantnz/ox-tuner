[graph]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/RustSec/advisory-db"]
# Advisories count for direct dependencies of workspace crates, transitive ones are
# reported but do not fail the build (they are upstream's to fix).
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# License allowlist: only these SPDX licenses are permitted anywhere in the
# dependency tree. Anything else (proprietary, GPL-2.0-only, unknown) is denied
# by default, so no explicit deny rule is needed to exclude it.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
unused-allowed-license = "allow"

[bans]
deny = [
  { crate = "gpui-pre", deny-multiple-versions = true, reason = "only one GPUI snapshot may appear in the dependency graph, it is pinned upstream via gpui-kit's re-export" },
]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The GPUI snapshot normally arrives through gpui-kit's re-export. If a dependency
# ever needs to pull it straight from git, whitelist that exact repository here.
allow-git = []

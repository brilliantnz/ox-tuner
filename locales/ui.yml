    unsent:
      en: '%{cells} tune values are not in ECU RAM yet. Write them first; burning now would persist the older values.'
    snapshot:
      en: A snapshot of the working tune is written before the burn. The pages are read back afterwards.
    cancel:
      en: Cancel
    confirm:
      en: Burn to flash

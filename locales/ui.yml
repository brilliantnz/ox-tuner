# Application copy for ox-tuner (crate: oxtuner-app).
#
# Registered by `rust_i18n::i18n!("../../locales", fallback = "en")` in
# `crates/oxtuner-app/src/lib.rs`; the directory lives at the workspace root so
# later crates (oxtuner-ui, a headless CLI) can point at the same files.
#
# One file per module, each key with its `en` text. A key names what the text is
# for, never the sentence. English ships today; adding a language means adding
# its side to each key plus an entry in the Settings language dropdown.
#
# Component strings are NOT duplicated here — gpui-kit's built-in locales serve
# them (dialogs, list search, the settings sidebar).
#
# Two tests in `src/i18n.rs` keep this file honest: every key the code asks for
# exists, and every key here is asked for by the code.
_version: 2

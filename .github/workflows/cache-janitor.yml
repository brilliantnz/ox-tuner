name: Cache janitor

# The repository shares a 10 GB Actions cache budget. rust-cache only writes
# from main now, but every dependency change still creates a new keyed entry
# and the old one stays until GitHub evicts it. This job keeps the budget
# healthy on purpose: it drops entries nobody restored for two weeks and, if
# the total is still high, the least recently used entries until it fits.
#
# It never touches the newest entries first, so the cache a pull request is
# most likely to restore survives.

on:
  schedule:
    # Weekly, early Monday UTC, when the repository is usually idle.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cache-janitor
  cancel-in-progress: false

jobs:
  prune:
    name: prune stale caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete stale and over-budget caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_AGE_DAYS: '14'
          MAX_TOTAL_GB: '8'
        run: |
          set -euo pipefail

          gh cache list --repo "$REPO" --limit 1000 \
            --json id,key,ref,sizeInBytes,lastAccessedAt \
            > "$RUNNER_TEMP/caches.json"

          python3 - "$RUNNER_TEMP/caches.json" "$MAX_AGE_DAYS" "$MAX_TOTAL_GB" \
            > "$RUNNER_TEMP/delete.txt" <<'PY'
          import json
          import sys
          from datetime import datetime, timedelta, timezone

          path, max_age_days, max_total_gb = sys.argv[1:]
          caches = json.load(open(path))
          max_age = timedelta(days=int(max_age_days))
          max_total = int(float(max_total_gb) * 1024**3)
          now = datetime.now(timezone.utc)

          def accessed(cache):
              raw = cache.get("lastAccessedAt")
              if not raw:
                  return datetime.min.replace(tzinfo=timezone.utc)
              # GitHub's timestamp carries a variable number of fractional
              # digits, which fromisoformat rejects on some Python versions.
              for fmt in ("%Y-%m-%dT%H:%M:%S.%f%z", "%Y-%m-%dT%H:%M:%S%z"):
                  try:
                      return datetime.strptime(raw.replace("Z", "+00:00"), fmt)
                  except ValueError:
                      pass
              return datetime.min.replace(tzinfo=timezone.utc)

          # Newest first: keep what a restore is most likely to hit.
          caches.sort(key=accessed, reverse=True)

          kept = 0
          kept_bytes = 0
          deleted = 0
          seen = set()
          for cache in caches:
              identity = (cache["key"], cache["ref"])
              duplicate = identity in seen
              seen.add(identity)

              stale = now - accessed(cache) > max_age
              over_budget = kept_bytes + cache["sizeInBytes"] > max_total
              if duplicate or stale or over_budget:
                  print(cache["id"])
                  deleted += 1
              else:
                  kept += 1
                  kept_bytes += cache["sizeInBytes"]

          print(
              f"kept {kept} caches ({kept_bytes / 1024**3:.2f} GiB), "
              f"deleting {deleted}",
              file=sys.stderr,
          )
          PY

          if [ -s "$RUNNER_TEMP/delete.txt" ]; then
            while read -r id; do
              echo "deleting cache $id"
              gh cache delete "$id" --repo "$REPO"
            done < "$RUNNER_TEMP/delete.txt"
          else
            echo "no caches to delete"
          fi

name: CI

# CI is split in two halves.
#
# This half runs on a Linux runner: format, cargo-deny, Clippy, the workspace
# tests, and the two short fuzz runs. It answers every pull request and every
# push to `main`.
#
# The other half lives in `platforms.yml`: Windows and macOS. Standard runners
# are free for a public repository, so it also runs on every pull request, as
# well as a push to `main`, a manual run, an approval, and a `/ci platforms`
# comment. It never starts before this half is green.
#
# A draft pull request and a push to a branch with no open pull request run no
# jobs. `/ci` and an approval only count when a maintainer writes them.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event name is part of the group so an approval only cancels an earlier
  # approval; it must never cancel the `pull_request` run it was waiting for.
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.event.issue.number || github.ref }}
  # A merge to `main` is never cancelled by the next one: every commit that
  # lands keeps the platform run it was given.
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Local checkouts may wrap rustc in sccache; runners must not. Cargo
  # treats an empty `RUSTC_WRAPPER` as "no wrapper".
  RUSTC_WRAPPER: ''
  # The commit under test. A comment run defaults to the base branch, and a
  # review event carries the reviewed commit rather than the branch tip, so
  # both are spelled out here once instead of in every checkout.
  CI_REF: >-
    ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number)
    || github.event_name == 'pull_request_review' && github.event.pull_request.head.sha
    || github.sha }}

jobs:
  # Single decision point for every trigger. Every other job needs this one, so
  # a skipped gate skips the whole run.
  gate:
    name: gate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      !github.event.pull_request.draft) ||
      (github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
      !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/ci'))
    steps:
      - run: echo "CI gate passed for ${{ github.event_name }}"

  # The three fast checks. None of them compiles Rust, so each is a short job
  # and the three run side by side.
  #
  # None of them repeats on an approval: the same commit already passed them on
  # its `pull_request` run. This repository has no require-status-check branch
  # protection, so a skipped check on the approval run cannot block a merge.
  fmt:
    name: fmt (rust)
    needs: gate
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_REF }}

      # Formatting compiles nothing, so it wants the pinned toolchain without
      # the build cache.
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: 'false'
      - run: cargo fmt --all --check

  # Markdown, JSON, YAML, TOML, CSS, JS — everything cargo fmt does not cover.
  # Configuration lives in .oxfmtrc.json; the pnpm version is pinned in package.json.
  fmt_nonrust:
    name: fmt (non-rust)
    needs: gate
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_REF }}
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          # `cache` is a boolean in pnpm/setup v3 (unlike actions/setup-node,
          # where it takes the package-manager name).
          cache: true
          # The action installs by default; the explicit frozen install below
          # is the one that decides, so this stops a second, non-frozen run.
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --check

  deny:
    name: deny (licenses, advisories, bans, sources)
    needs: gate
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_REF }}
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Clippy and the workspace tests share one job on purpose. They both build
  # the dependency tree into target/debug, so one runner does both and the tree
  # is compiled once.
  checks:
    name: clippy + tests (linux)
    needs: gate
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_REF }}

      # This job is also Linux's coverage: the platform matrix runs Windows and
      # macOS only, so the Linux packages are installed here and nowhere else.
      - uses: ./.github/actions/linux-system-packages

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache-key: linux

      # nextest is what the project runs locally, so CI runs it too. It does
      # not run doctests, which is why `cargo test --doc` follows.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo nextest run --workspace --all-features --locked
      - run: cargo test --workspace --all-features --locked --doc

  # The parsers take untrusted bytes: the protocol and trace targets read the
  # wire and a recorded session, and the INI targets read a user-supplied
  # definition file. The short runs below gate a change; `fuzz.yml` runs the
  # same targets for longer on a schedule.
  #
  # The run is scoped to the parser that changed. Building the nightly fuzz
  # targets is the slow part, and a UI or project-only change cannot reach
  # those parsers; the default is to run, so an unknown event still fuzzes.
  #
  # One matrix job per target: the targets are single-threaded, and running
  # eight 60-second targets in one job made the fuzz gate the longest check on
  # every pull request. Parallel jobs keep the gate near the slowest target
  # plus one cached build.
  fuzz:
    name: fuzz (${{ matrix.target }})
    needs: gate
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: decode_frame
            parser: protocol
            dir: crates/oxtuner-protocol/fuzz
            dict: false
          - target: replay_trace
            parser: protocol
            dir: crates/oxtuner-protocol/fuzz
            dict: false
          - target: parse_ini
            parser: ini
            dir: crates/oxtuner-ini
            dict: true
          - target: parse_bytes
            parser: ini
            dir: crates/oxtuner-ini
            dict: true
          - target: preprocess
            parser: ini
            dir: crates/oxtuner-ini
            dict: true
          - target: bit_options
            parser: ini
            dir: crates/oxtuner-ini
            dict: true
          - target: pc_variables
            parser: ini
            dir: crates/oxtuner-ini
            dict: true
          - target: sections
            parser: ini
            dir: crates/oxtuner-ini
            dict: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_REF }}

      - name: Scope the run to the parser that changed
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          run_all() {
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          }

          case "${{ github.event_name }}" in
            pull_request)
              if git fetch --depth=1 --no-tags origin "${{ github.base_ref }}" 2>/dev/null; then
                base=FETCH_HEAD
              else
                run_all
              fi
              ;;
            push)
              # The previous tip of the branch, so a multi-commit push is
              # compared against where it started instead of only its last
              # commit.
              base='${{ github.event.before }}'
              if [ "$base" = "0000000000000000000000000000000000000000" ]; then
                run_all
              fi
              if ! git fetch --depth=1 --no-tags origin "$base" 2>/dev/null; then
                run_all
              fi
              base=FETCH_HEAD
              ;;
            *)
              run_all
              ;;
          esac

          changed="$RUNNER_TEMP/changed.txt"
          if ! git diff --name-only "$base" HEAD > "$changed"; then
            run_all
          fi

          # The fuzz crates have their own lockfiles, which the path filters
          # below already cover. A workspace-level dependency or toolchain bump
          # can change either parser, so it runs both.
          if grep -qE '^(Cargo\.lock|Cargo\.toml|rust-toolchain\.toml)$' "$changed"; then
            run_all
          fi

          case "${{ matrix.parser }}" in
            protocol) parser_path='^crates/oxtuner-protocol/' ;;
            ini) parser_path='^crates/oxtuner-ini/' ;;
          esac
          if grep -qE "$parser_path" "$changed"; then
            run_all
          fi

          echo 'run=false' >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@nightly
        if: steps.scope.outputs.run == 'true'
      # The GNU target builds serialport's libudev support, which the fuzz crate
      # reaches through `oxtuner-transport`; without libudev-dev its build
      # script fails before any fuzzing starts.
      - uses: ./.github/actions/linux-system-packages
        if: steps.scope.outputs.run == 'true'
      # `cargo-fuzz` is not in install-action's prebuilt list, so it resolves
      # through cargo-binstall. That installs the musl build of cargo-fuzz,
      # whose compiled-in default target is x86_64-unknown-linux-musl. The
      # target is not installed and ASAN rejects a static libc, so name the
      # runner's GNU host explicitly on every `fuzz run` below.
      - uses: taiki-e/install-action@v2
        if: steps.scope.outputs.run == 'true'
        with:
          tool: cargo-fuzz
      # The fuzz crates build into their own target directory, outside the
      # workspace one, so each needs its own cache entry. A key per target
      # keeps the parallel saves from racing for one entry. Branches restore
      # the main cache but do not write one; see setup-rust.
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true'
        with:
          workspaces: |
            crates/oxtuner-protocol/fuzz -> target
            crates/oxtuner-ini/fuzz -> target
          key: fuzz-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run the target (60 s)
        if: steps.scope.outputs.run == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          if [ "${{ matrix.dict }}" = "true" ]; then
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "${{ matrix.target }}" -- -dict="$GITHUB_WORKSPACE/crates/oxtuner-ini/fuzz/ini.dict" -max_total_time=60 -max_len=65536
          else
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "${{ matrix.target }}" -- -max_total_time=60 -max_len=65536
          fi

  # The second half. This job owns no runner of its own: it hands the work
  # to `platforms.yml`.
  #
  # `always()` is required to reach the condition at all once a `needs` job is
  # skipped, which is exactly what an approval run does to the Linux jobs. The
  # result checks keep the rule that a failed Linux check never triggers the
  # platform run; a scoped-out fuzz job counts as passed.
  platforms:
    name: platforms (windows, macos)
    needs: [fmt, fmt_nonrust, deny, checks, fuzz]
    if: >-
      always() &&
      ((github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
      !github.event.pull_request.draft) ||
      (((github.event_name == 'pull_request' &&
      !github.event.pull_request.draft) ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
      startsWith(github.event.comment.body, '/ci platforms'))) &&
      needs.fmt.result == 'success' &&
      needs.fmt_nonrust.result == 'success' &&
      needs.deny.result == 'success' &&
      needs.checks.result == 'success' &&
      (needs.fuzz.result == 'success' || needs.fuzz.result == 'skipped')))
    uses: ./.github/workflows/platforms.yml
    with:
      ref: >-
        ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number)
        || github.event_name == 'pull_request_review' && github.event.pull_request.head.sha
        || github.sha }}
      # A comment or a plain pull request asks for the platform test, not for
      # the release build; a merge and an approval get both.
      release: >-
        ${{ github.event_name != 'pull_request' &&
        github.event_name != 'issue_comment' }}

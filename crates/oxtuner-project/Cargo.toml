[package]
name = "oxtuner-project"
description = "TunerStudio projects and .msq tune files: load, check, round-trip."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The library holds no `#[bench]` functions; without this, `cargo bench` also
# builds and runs an empty harness for it.
[lib]
bench = false

[[bench]]
name = "open"
harness = false

[dependencies]
oxtuner-ini.workspace = true
oxtuner-tune.workspace = true
postcard = { workspace = true, default-features = false, features = ["alloc"] }
serde.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true

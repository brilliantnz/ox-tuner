[package]
name = "oxtuner-tune"
description = "The tune, values, images, derived write state and change tracking."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The library holds no `#[bench]` functions; without this, `cargo bench` also
# builds and runs an empty harness for it.
[lib]
bench = false

[[bench]]
name = "state"
harness = false

[dependencies]
oxtuner-ini.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[lints]
workspace = true

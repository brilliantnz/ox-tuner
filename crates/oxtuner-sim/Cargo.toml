[package]
name = "oxtuner-sim"
description = "A virtual ECU built from a real definition, for tests and daily development."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The library holds no `#[bench]` functions; without this, `cargo bench` also
# builds and runs an empty harness for it.
[lib]
bench = false

[[bench]]
name = "generate"
harness = false

[dependencies]
oxtuner-ini.workspace = true
oxtuner-protocol.workspace = true
oxtuner-transport.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[lints]
workspace = true

[package]
name = "oxtuner-core"
description = "Headless core for ox-tuner: typed command/event bus, one owning thread, definition lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The library holds no `#[bench]` functions; without this, `cargo bench` also
# builds and runs an empty harness for it.
[lib]
bench = false

[[bench]]
name = "dialog"
harness = false

[[bench]]
name = "summary"
harness = false

[dependencies]
crossfire.workspace = true
oxtuner-datalog.workspace = true
oxtuner-ini.workspace = true
oxtuner-project.workspace = true
oxtuner-protocol.workspace = true
oxtuner-transport.workspace = true
oxtuner-tune.workspace = true
serde.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["formatting"] }
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
oxtuner-sim.workspace = true

[lints]
workspace = true

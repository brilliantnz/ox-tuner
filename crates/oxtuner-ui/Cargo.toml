[package]
name = "oxtuner-ui"
description = "Custom reusable GPUI widgets for ox-tuner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The library holds no `#[bench]` functions; without this, `cargo bench` also
# builds and runs an empty harness for it.
[lib]
bench = false

[[bench]]
name = "model"
harness = false

[dependencies]
# `x11` is a default feature of gpui-kit 0.11; this crate disables the defaults,
# so it asks for the Linux backend explicitly.
gpui-kit = { workspace = true, default-features = false, features = ["assets", "component", "x11"] }
oxtuner-core.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
gpui-kit = { workspace = true, default-features = false, features = ["test-support"] }
oxtuner-ini.workspace = true

[lints]
workspace = true

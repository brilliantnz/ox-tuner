[package]
name = "oxtuner-protocol"
description = "ECU protocol framing and commands (Speeduino / MS-compatible) for ox-tuner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The library holds no `#[bench]` functions; without this, `cargo bench` also
# builds and runs an empty harness for it.
[lib]
bench = false

[[bench]]
name = "frame"
harness = false

[dependencies]
oxtuner-ini.workspace = true
oxtuner-transport.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[lints]
workspace = true

serde_json.workspace = true
sha2.workspace = true
reqwest = { workspace = true, features = ["blocking", "native-tls"] }
tracing.workspace = true

[dev-dependencies]
oxtuner-protocol.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true

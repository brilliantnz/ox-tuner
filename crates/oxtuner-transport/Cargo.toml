[package]
name = "oxtuner-transport"
description = "Byte transports for ox-tuner: serial, trace recording and replay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The library holds no `#[bench]` functions; without this, `cargo bench` also
# builds and runs an empty harness for it.
[lib]
bench = false

[[bench]]
name = "trace"
harness = false

[dependencies]
serial2 = "0.2.39"
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true

[lints]
workspace = true

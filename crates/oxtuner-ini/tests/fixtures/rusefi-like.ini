; Synthetic definition for the test suite.
;
; It reproduces the shapes a generated rusEFI INI uses: a file-level entry
; before the first section, the signature in [TunerStudio], comma-delimited
; command lists with empty entries, per-page command blocks declared out of
; order, `;+` field help, plural [ConstantsExtensions], `readOnly` on a table
; axis, and reusable indicator panels declared outside a dialog. It is written
; for ox-tuner and is not a copy of any third-party file.

enable2ndByteCanID = false

[SettingGroups]
        settingGroup = mcu, "Controller"

[TunerStudio]
        queryCommand    = "S"
        versionInfo     = "V"  ; firmware version for the title bar
        signature       = "rusEFI test.f407-discovery.123"
        useLegacyFTempUnits = false
        ignoreMissingBitOptions = true
        surpressConfigErrorVerbiage = true
        noCommReadDelay = true

[Constants]
        ; new packet serial format with CRC
        messageEnvelopeFormat = msEnvelope_1.0
        endianness = little
        nPages = 2
        pageIdentifier = "\x00\x00", "\x00\x01"
        pageSize = 20000, 128
        pageReadCommand = "R%2i%2o%2c", "R%2i%2o%2c"
        burnCommand = "B%2i", ""
        pageValueWrite = "C%2i%2o%2c%v", "C%2i%2o%2c%v"
        pageChunkWrite = "C%2i%2o%2c%v", "C%2i%2o%2c%v"
        crc32CheckCommand = "k%2i%2o%2c", "k%2i%2o%2c"
        retrieveConfigError = "e"
        pageActivationDelay = 500
        writeBlocks = on
        blockReadTimeout = 3000
        blockingFactor = 1024

        ; String lists for bit options; no space around the `=`
        #define gpio_list="NONE", "INVALID", "PA0", "PA1"

        ; Pages may be declared out of order
        page = 2
        secondTable = array, U08, [4], "%", 1, 0, 0, 100, 0

        # Digital outputs
        page = 1
        engineMake = string, ASCII, 1184, 32
        luaScript = string, ASCII, 0, 8000
        bias_resistor = scalar, F32, 64, "Ohm", 1, 0, 0, 200000, 1
        injectionMode;+"Select the injection mode used" = bits, U08, 68, [0:1], "Simultaneous", "Sequential"
        gpio = bits, U08, 69, [0:7], $gpio_list
        veTable = array, U16, 196, [16x16], "%", 0.1, 0, 0.0, 200.0, 1

[BurstMode]
        getCommand = "A"

[OutputChannels]
        ochGetCommand = "O%2o%2c"
        ochBlockSize = 2248

        rpm = scalar, U16, 0, "RPM", 1, 0
        crank = bits, U32, 852, [11:11]
        fuelingLoad = scalar, U16, 6, "%", 0.1, 0
        RPMValue = scalar, U16, 0, "RPM", 1, 0

[PcVariables]
        gearCountArray = array, S08, [10], "Gear", 1, 0, -1, 8, 0, noMsqSave
        tsCanId = bits, U08, [0:3], "CAN ID 0", "CAN ID 1", "CAN ID 2", "CAN ID 3"
        liveBaro = channelValueOnConnect, baro

[ConstantsExtensions]
        defaultValue = gearCountArray, -1 0 1 2 3 4 5 6 7 8
        maintainConstantValue = veTable, { 1 }
        readOnly = gearCountArray
        controllerPriority = bias_resistor

[TableEditor]
        table = veTable1Tbl, veTable1Map, "VE Table"
                xBins = gearCountArray, RPMValue, readOnly
                yBins = gearCountArray, fuelingLoad
                zBins = veTable

[CurveEditor]
        curve = idleCurve, "Idle"
                xBins = gearCountArray, coolant
                yBins = veTable
                size = 300, 200

[UserDefined]
        dialog = veTableDialog, "VE Table"
                field = "RPM", rpm

indicatorPanel = fuel_computerIndicatorPanel, 2
indicator = {injectorHwIssue}, "injector ok", "injector issue"

[Menu]
        menuDialog = main
        menu = "Fuel"
                subMenu = veTableDialog, "VE", 0, { fuelPumpMode == 2 }
                groupMenu = "Injector Setup"
                groupChildMenu = veTableDialog, "Injection configuration"

[Datalog]
        entry = rpm, "RPM", int, %.0f

[ControllerCommands]
cmdTest = "E\x01\x01"

[KeyActions]
        showPanel = C,T, veTableDialog

[Tools]
        tool = x

[EventTriggers]
        x = y

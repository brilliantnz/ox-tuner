; Synthetic definition for the test suite.
;
; It reproduces the *shapes* a real Speeduino INI uses (settings-conditional
; protocol commands, page blocks, $define option lists, lastOffset overlays,
; brace expressions, trailing storage keywords). It is written for ox-tuner and
; is not a copy of any third-party file; the real definitions are never bundled
; (ADR-0006 decision 7).

#unset enablehardware_test

[MegaTune]
   MTversion      = 2.25
   queryCommand   = "Q"
   signature      = "speeduino 202501"
   versionInfo    = "S" ;shown in the title bar

[TunerStudio]
   iniSpecVersion = 3.78

[SettingGroups]
    settingGroup = mcu, "Controller in use"
    settingOption = DEFAULT, "Arduino Mega 2560"
    settingOption = mcu_stm32, "STM32"
    settingGroup = COMMS_COMPAT_GROUP, "Serial Mode"
    settingOption = COMMS_COMPAT, "Compatibility Mode"
    settingOption = DEFAULT, "Normal"

[Constants]
    endianness          = little
    nPages              = 2
    pageSize            = 288,   288
    pageIdentifier      = "\$tsCanId\x01", "\$tsCanId\x02"
    pageReadCommand     = "p%2i%2o%2c", "p%2i%2o%2c"
#if COMMS_COMPAT
    ;Compatibility mode slows the burn down
    burnCommand         = "B%2i", "B%2i"
#else
    burnCommand         = "b%2i", "b%2i"
#endif
    pageValueWrite      = "w%2i%2o%2c%v", "w%2i%2o%2c%v"
    pageChunkWrite      = "M%2i%2o%2c%2v", "M%2i%2o%2c%2v"
    crc32CheckCommand   = "d%2i", "d%2i"
#if mcu_stm32
    blockingFactor = 121
#else
    blockingFactor = 251
#endif
#if COMMS_COMPAT
    blockingFactor = 121
#endif
    delayAfterPortOpen  = 1000

    ;Padding for bit fields, composed from a smaller define
    #define invalid_x8      = "INVALID", "INVALID", "INVALID", "INVALID", "INVALID", "INVALID", "INVALID", "INVALID"
    #define invalid_x16     = $invalid_x8,  $invalid_x8

    page = 1
    primeBins       = array,  U08,   87, [4],  "F", 1.8,    -22.23,    -40,   419,      0
    CTPSPin         = bits,   U08,   91, [0:5], "Board Default", "INVALID", "3", "4"
    idleAdvDelay    = bits,   U08,   92, [3:7], $invalid_x16
    idleAdvRPM      = scalar, U08,   93, "rpm", 100, 0.0, 100, 25500, 0
    stoich          = scalar, U08,   94, "AFR", 0.1, 0.0, 7.0, 25.5, 1
    ego_min_lambda  = scalar, U08,   95, "Lambda", {0.1 / stoich}, 0, {7 / stoich}, {25 / stoich}, 3
    boardFuelOutputs = array, U08, [128], " ", 1.0, 0, 0, 255, 0, noMsqSave
    AUXin00Alias    = string, ASCII, 20

    page = 2
    rpmBins         = array, U08,   0, [16],    "RPM", 100, 0, 0, 25500, 0
    fuelLoadBins    = array, U08,  16, [16],    "%",   1,   0, 0, 255, 0
    veTable         = array, U08,  32, [16x16], "%",   1,   0, 0, 255, 0
    afrTable        = array, U08,  lastOffset, [16x16], "AFR", 0.1, 0.0, 7, 25.5, 1

[ConstantsExtensions]
    defaultValue = fuel_rows, 16
    readOnly = engineMake
    requiresPowerCycle = idleAdvRPM

[PcVariables]
    ; The CAN id substituted into command strings as $tsCanId
    tsCanId = bits, U08, [0:3], "CAN ID 0", "CAN ID 1", "CAN ID 2", "CAN ID 3"

[TableEditor]
   table = veTable1Tbl,  veTable1Map,  "VE Table",   2
      topicHelp   = "https://example.invalid/ve"
      xBins       = rpmBins,  rpm
      yBins       = fuelLoadBins, fuelLoad
      xyLabels    = "RPM", "Fuel Load: "
      zBins       = veTable
      gridHeight  = 2.0
      gridOrient  = 250,   0, 340
      upDownLabel = "(RICHER)", "(LEANER)"

[CurveEditor]
      curve = cltIdleRpmCurve, "Idle Target RPM"
            columnLabel = "Coolant", "RPM"
            xAxis = -40, 120, 9
            yAxis = 800, 1200, 9
            xBins = cltIdleRpmBins, coolant
            yBins = cltIdleRpm, RPMValue

[GaugeConfigurations]
    gaugeCategory = "Engine"
    rpmGauge = rpm, "Engine Speed", "RPM", 0, 7000, 0, 500, 6000, 7000, 0, 0

[FrontPage]
   gauge2 = mapGauge
   gauge1 = rpmGauge
   indicator = { running }, "Not Running", "Running", white, black, green, black

[OutputChannels]
  ochGetCommand    = "r\$tsCanId\x30%2o%2c"
  ochBlockSize     = 130

  secl       = scalar, U08, 0, "sec",  1.000, 0.000
  status1    = scalar, U08, 1, "bits", 1.000, 0.000
  inj1Status = bits,   U08, 1, [0:0]
  rpm        = scalar, U16, 4, "RPM",  1.000, 0.000
  map        = scalar, U16, 6, "kpa",  1.000, 0.000
  nSquirts  = bits,    U08, 84, [5:7]
  pulseLimit = { cycleTime / nSquirts }, "ms"

[Datalog]
  category = "Fuel"
  entry = rpm, "RPM", int, %.0f

[ControllerCommands]
cmdStopTestMode   = "E\x01\x00"
cmdEnableTestMode = "E\x01\x01"
displayCommand = cmdEnableTestMode, "Enable test mode"

[Menu]
   menuDialog = main
   menu = "Fuel"
      subMenu = veTable1Tbl, "VE Table"
      subMenu = std_realtime, "Realtime"
      std_separator

[UserDefined]
   dialog = veTableDialog, "VE Table", border
      panel = veTable1Tbl, Center
      field = "RPM", rpm

[EventTriggers]
   trigger = something

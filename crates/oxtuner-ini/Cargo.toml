[package]
name = "oxtuner-ini"
description = "TunerStudio-style ECU definition (.ini) parser: preprocess, resolve, freeze."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The library holds no `#[bench]` functions; without this, `cargo bench` also
# builds and runs an empty harness for it.
[lib]
bench = false

[[bench]]
name = "parse"
harness = false

# No runtime dependencies on purpose: the dialect is hand-written (ADR-0006),
# which keeps the parser easy to audit and `cargo deny` trivial.
[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[lints]
workspace = true

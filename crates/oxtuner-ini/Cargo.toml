[package]
name = "oxtuner-ini"
description = "TunerStudio-style ECU definition (.ini) parser: preprocess, resolve, freeze."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The library holds no `#[bench]` functions; without this, `cargo bench` also
# builds and runs an empty harness for it.
[lib]
bench = false

[[bench]]
name = "parse"
harness = false

# The model carries `serde` derives so `oxtuner-project` can cache a parsed
# definition, and `tracing` supplies the parse-phase spans. The dialect itself
# is still hand-written and reads no parser dependency.
[dependencies]
oxtuner-encoding.workspace = true
serde = { workspace = true, features = ["rc"] }
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
postcard = { workspace = true, default-features = false, features = ["alloc"] }
proptest.workspace = true

[lints]
workspace = true

[package]
name = "oxtuner-ini-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# A separate workspace: `cargo fuzz` builds with nightly and a sanitizer, which
# the normal workspace build must never inherit.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
oxtuner-ini = { path = ".." }

[[bin]]
name = "parse_ini"
path = "fuzz_targets/parse_ini.rs"
test = false
doc = false

[[bin]]
name = "parse_bytes"
path = "fuzz_targets/parse_bytes.rs"
test = false
doc = false

[[bin]]
name = "preprocess"
path = "fuzz_targets/preprocess.rs"
test = false
doc = false

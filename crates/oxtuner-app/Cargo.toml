[package]
name = "oxtuner-app"
description = "Native ECU tuning application for ox-tuner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "oxtuner"
path = "src/main.rs"
bench = false

# The window and the GPUI views are covered by the headless UI tests, so this
# crate has no benchmarks; the flags keep `cargo bench` from building empty
# harnesses for it.
[lib]
bench = false

[dependencies]
directories = "6.0.0"
gpui-kit.workspace = true
oxtuner-core.workspace = true
oxtuner-log.workspace = true
oxtuner-project.workspace = true
oxtuner-sim.workspace = true
oxtuner-ui.workspace = true
rust-i18n = "4.2.4"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# Headless UI tests need the Kit's observation helpers.
[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

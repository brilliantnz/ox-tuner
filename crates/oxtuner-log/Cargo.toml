[package]
name = "oxtuner-log"
description = "Process-wide tracing pipeline for ox-tuner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The library holds no `#[bench]` functions; without this, `cargo bench` also
# builds and runs an empty harness for it.
[lib]
bench = false

[[bench]]
name = "pipeline"
harness = false

[dependencies]
thiserror = "2.0.21"
time = { workspace = true, features = ["formatting", "macros", "local-offset"] }
tracing.workspace = true
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# ox-tuner — Cargo workspace.
#
# The repository and workspace are `ox-tuner`, the shipped binary is `oxtuner`,
# crates use the `oxtuner-` prefix.

[workspace]
resolver = "3"
members = [
  "crates/oxtuner-app",
  "crates/oxtuner-core",
  "crates/oxtuner-datalog",
  "crates/oxtuner-ini",
  "crates/oxtuner-log",
  "crates/oxtuner-project",
  "crates/oxtuner-protocol",
  "crates/oxtuner-sim",
  "crates/oxtuner-transport",
  "crates/oxtuner-tune",
  "crates/oxtuner-ui",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/brilliantnz/ox-tuner"

[workspace.dependencies]
gpui-kit = "=0.8.1"
oxtuner-core = { path = "./crates/oxtuner-core" }
oxtuner-datalog = { path = "./crates/oxtuner-datalog" }
oxtuner-ini = { path = "./crates/oxtuner-ini" }
oxtuner-log = { path = "./crates/oxtuner-log" }
oxtuner-project = { path = "./crates/oxtuner-project" }
oxtuner-protocol = { path = "./crates/oxtuner-protocol" }
oxtuner-sim = { path = "./crates/oxtuner-sim" }
oxtuner-transport = { path = "./crates/oxtuner-transport" }
oxtuner-tune = { path = "./crates/oxtuner-tune" }
oxtuner-ui = { path = "./crates/oxtuner-ui" }

# Lints are declared once here and inherited by every crate (`[lints] workspace = true`).
# CI additionally runs `cargo clippy -- -D warnings`.
[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
# ADR-0007: safety-critical code. No `unsafe` without an ADR + documented justification.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# gpui-kit's installation guide: debug builds leave GPUI, layout and text
# rendering unoptimized, which makes the window feel slow while developing.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-component = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

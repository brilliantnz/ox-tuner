# ox-tuner — Cargo workspace.
#
# The repository and workspace are `ox-tuner`, the shipped binary is `oxtuner`,
# crates use the `oxtuner-` prefix.

[workspace]
resolver = "3"
members = [
  "crates/oxtuner-app",
  "crates/oxtuner-core",
  "crates/oxtuner-datalog",
  "crates/oxtuner-ini",
  "crates/oxtuner-log",
  "crates/oxtuner-project",
  "crates/oxtuner-protocol",
  "crates/oxtuner-sim",
  "crates/oxtuner-transport",
  "crates/oxtuner-tune",
  "crates/oxtuner-ui",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/brilliantnz/ox-tuner"

[workspace.dependencies]
# Third-party crates used by more than one member. A member that needs extra
# features says so locally; the version lives here, once.
criterion = "0.8.2"
crossfire = "3.1.22"
gpui-kit = "=0.9.0"
postcard = "1.1.3"
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
time = "0.3.55"
tracing = "0.1.44"

# Workspace crates, all by path.
oxtuner-core = { path = "./crates/oxtuner-core" }
oxtuner-datalog = { path = "./crates/oxtuner-datalog" }
oxtuner-ini = { path = "./crates/oxtuner-ini" }
oxtuner-log = { path = "./crates/oxtuner-log" }
oxtuner-project = { path = "./crates/oxtuner-project" }
oxtuner-protocol = { path = "./crates/oxtuner-protocol" }
oxtuner-sim = { path = "./crates/oxtuner-sim" }
oxtuner-transport = { path = "./crates/oxtuner-transport" }
oxtuner-tune = { path = "./crates/oxtuner-tune" }
oxtuner-ui = { path = "./crates/oxtuner-ui" }

# Lints are declared once here and inherited by every crate (`[lints] workspace = true`).
# CI additionally runs `cargo clippy -- -D warnings`.
[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# ADR-0007: safety-critical code. No `unsafe` without an ADR + documented justification.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
exhaustive_enums = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
# `#[must_use]` is written where dropping the result would lose the caller's
# work. The candidate lint stays off for the rest: it also flags conversions
# and lookups whose result is fine to ignore.
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"

# Criterion keeps its own profiles in `target/criterion`; unwinding debug info
# in the bench profile is what lets `samply` / `instruments` resolve symbols
# when a bench needs a flame graph. It does not change the measured code.
[profile.bench]
debug = true

# gpui-kit's installation guide: debug builds leave GPUI, layout and text
# rendering unoptimized, which makes the window feel slow while developing.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-component = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
